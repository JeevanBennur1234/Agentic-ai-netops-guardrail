[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netops_guardrail"
version = "0.1.0"
description = "Agentic AI-NetOps Guardrail: Formal graph verification, cryptographic audit, and human-in-the-loop control for automated network remediation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bennurjeevan"}
]
dependencies = [
    "networkx",
    "flask",
    "ecdsa",
    "jsonschema",
    "prometheus_client",
    "requests",
    "ryu",
    "eventlet<0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
netops-server = "netops_guardrail.observability.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line length handled by formatter
    "E402",  # Module level import not at top
    "E701",  # Multiple statements on one line (colon)
    "E702",  # Multiple statements on one line (semicolon)
    "E731",  # Do not assign a lambda expression
    "E741",  # Ambiguous variable name
    "F841",  # Local variable is assigned to but never used
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E711", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["netops_guardrail"]
