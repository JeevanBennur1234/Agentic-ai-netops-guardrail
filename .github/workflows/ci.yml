name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          # Ryu 4.34 calls a setuptools API removed by newer releases.
          # Use a compatible setuptools and disable isolated builds so Ryu
          # uses that pinned version instead of downloading the latest one.
          python -m pip install --upgrade pip
          python -m pip install "setuptools==67.6.1" wheel
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
